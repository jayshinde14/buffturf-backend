server.port=8080

# ?? Database ??????????????????????????????????????????????????????
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/buffturf_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:hpvictus}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?? JPA / Hibernate ???????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# ?? App Timezone ??????????????????????????????????????????????????
spring.jackson.time-zone=Asia/Kolkata

# ?? HikariCP Connection Pool (keeps Clever Cloud connection alive) ?
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000

# ?? JWT ???????????????????????????????????????????????????????????
app.jwt.secret=${JWT_SECRET:BuffTURFSecretKey2024VeryLongAndSecureKeyForJWTSigning123456}
app.jwt.expiration=86400000

# ?? File Upload ???????????????????????????????????????????????????
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ?? Razorpay ??????????????????????????????????????????????????????
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:placeholder_secret}

# ?? App ???????????????????????????????????????????????????????????
spring.application.name=buffturf-backend

# AI Gemini API configuration
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
gemini.api.key=${GEMINI_API_KEY:}

# ── Email Configuration (Gmail SMTP) ─────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# App Frontend URL (used in email links)
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.email.from=${GMAIL_USERNAME:noreply@buffturf.com}

# ── Redis Configuration (Distributed Slot Lock) ──────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
# Default TTL for slot reservation hold in seconds (10 minutes = 600s)
buffturf.slot.reservation.ttl.seconds=${SLOT_RESERVATION_TTL_SECONDS:600}

